# LyricalAI: serves the built React app and reverse-proxies /api to the backend.
#
# Mounted into the frontend container as an Nginx template, so ${NGINX_...}
# variables are filled in from the environment at start-up. Nginx's own
# variables ($host, $uri, ...) are left untouched.

limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;

upstream lyricalai_backend {
    server backend:8000;
    keepalive 8;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Slightly above MAX_FILE_SIZE_MB to leave room for the multipart envelope.
    client_max_body_size ${NGINX_CLIENT_MAX_BODY_SIZE};
    server_tokens off;
    # Keep redirects relative so they work on any published port or behind a proxy.
    absolute_redirect off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://lyricalai_backend;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Stream uploads straight to the backend instead of spooling them twice.
        proxy_request_buffering off;
    }

    # Slow down password guessing.
    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://lyricalai_backend;
    }

    # Oversized uploads get the same JSON error shape as the API.
    error_page 413 @payload_too_large;
    location @payload_too_large {
        default_type application/json;
        return 413 '{"detail":"The file is too large.","code":"FILE_TOO_LARGE"}';
    }

    location = /docs  { return 302 /api/docs; }
    location = /redoc { return 302 /api/redoc; }

    # Fingerprinted build assets can be cached forever.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
