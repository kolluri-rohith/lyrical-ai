# Optional NVIDIA GPU override (needs the NVIDIA Container Toolkit on the host):
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
#
services:
  backend:
    build:
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu121
    environment:
      DEVICE: auto
      # Lets Whisper (CTranslate2) find the cuBLAS/cuDNN libraries shipped with PyTorch.
      LD_LIBRARY_PATH: /usr/local/lib/python3.11/site-packages/nvidia/cublas/lib:/usr/local/lib/python3.11/site-packages/nvidia/cudnn/lib
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
